[project]
name = "railboard"
version = "0.1.0"
description = "Task manager for a human and their agents: FastAPI + SQLite server, React UI, Python CLI"
requires-python = ">=3.12"
# The CLI uses only the standard library, so `uv tool install` of the bare
# package is enough on a machine that only runs agents.
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = ["fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27", "pytest>=8"]

[project.scripts]
rail = "rail.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rail"]

[tool.pytest.ini_options]
pythonpath = ["src"]
